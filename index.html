<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Application</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white w-full max-w-2xl p-6 rounded-xl shadow-lg">

    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-blue-600">
        Quiz App
      </h1>

      <div class="bg-red-500 text-white px-4 py-2 rounded">
        Time: <span id="timer">15</span>s
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="w-full bg-gray-300 h-3 rounded-full mb-6">
      <div id="progress"
        class="bg-blue-500 h-3 rounded-full"
        style="width: 0%">
      </div>
    </div>

    <!-- Question -->
    <h2 id="question" class="text-xl font-semibold mb-6">
      Question
    </h2>

    <!-- Answers -->
    <div id="answers" class="space-y-3"></div>

    <!-- Buttons -->
    <div class="flex justify-between mt-6">
      <button id="nextBtn"
        class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded">
        Next
      </button>

      <button id="restartBtn"
        class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded hidden">
        Restart
      </button>
    </div>

    <!-- Result -->
    <div id="result" class="mt-6 text-center"></div>

  </div>

  <script src="main.js"></script>
</body>
</html>
